[project]
name = "yongchun-site-selection-mvp"
version = "0.1.0"
description = "永春县农业种植选址交互地图 MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "folium>=0.19,<1",
  "geopandas>=1.0,<2",
  "numpy>=2.0,<3",
  "lxml>=5,<7",
  "pandas>=2.2,<3",
  "planetary-computer>=1.0,<2",
  "pyarrow>=18,<24",
  "pyogrio>=0.10,<1",
  "pystac-client>=0.9,<1",
  "rasterio>=1.4,<2",
  "requests>=2.32,<3",
  "shapely>=2.0,<3",
  "streamlit>=1.41,<2",
  "streamlit-folium>=0.24,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gover_mvp"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
